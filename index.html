function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.closePath()}function wrap(c,t,x,y,w,lh,max=3){let l='',a=[];for(let ch of [...t]){let q=l+ch;if(c.measureText(q).width>w&&l){a.push(l);l=ch}else l=q}if(l)a.push(l);a.slice(0,max).forEach((s,i)=>c.fillText(s,x,y+i*lh));return y+Math.min(a.length,max)*lh}function fit(c,t,x,y,w,s=31){while(s>21){c.font=`700 ${s}px sans-serif`;if(c.measureText(t).width<=w)break;s--}c.fillText(t,x,y)}function loadImg(src){return new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src})}function cover(c,i,x,y,w,h){let k=Math.max(w/i.width,h/i.height),sw=w/k,sh=h/k;c.drawImage(i,(i.width-sw)/2,(i.height-sh)/2,sw,sh,x,y,w,h)}
// Sharing is optional: never block startup on the embedded image bundle.
let shareAssetsPromise = null;
function loadShareAssets() {
  if (window.SHARE_ASSETS) return Promise.resolve(window.SHARE_ASSETS);
  if (shareAssetsPromise) return shareAssetsPromise;
  shareAssetsPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'assets/share-assets.js?v=3';
    script.async = true;
    const timer = setTimeout(() => finish(new Error('Share assets timed out')), 20000);
    function finish(error) {
      clearTimeout(timer);
      script.onload = script.onerror = null;
      script.remove();
      if (error) { shareAssetsPromise = null; reject(error); }
      else resolve(window.SHARE_ASSETS);
    }
    script.onload = () => finish(window.SHARE_ASSETS ? null : new Error('Invalid share assets'));
    script.onerror = () => finish(new Error('Share assets failed to load'));
    document.head.appendChild(script);
  });
  return shareAssetsPromise;
}
// Share-only typography helpers: never truncate the underlying game data.
function shareLines(c, text, maxWidth) {
  const lines = [];
  let line = '';
  for (const ch of [...text]) {
    if (line && c.measureText(line + ch).width > maxWidth) {
      lines.push(line);
      line = ch;
    } else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}
function shareText(c, text, width, size, minSize, maxLines, weight) {
  let lines;
  do {
    c.font = `${weight} ${size}px sans-serif`;
    lines = shareLines(c, text, width);
    if (lines.length <= maxLines || size <= minSize) break;
    size -= 1;
  } while (true);
  return { lines, size, lineHeight: Math.round(size * 1.3), weight };
}
function paintShareText(c, block, x, y, color) {
  c.fillStyle = color;
  c.font = `${block.weight} ${block.size}px sans-serif`;
  block.lines.forEach((line, i) => c.fillText(line, x, y + i * block.lineHeight));
}
async function loadResultQr() {
  const img = new Image();
  img.src = 'assets/images/zt-qr-code.png';
  // Decode the original PNG, never a resized screenshot or the old bundle QR.
  await img.decode();
  if (!img.naturalWidth || img.naturalWidth !== img.naturalHeight) throw new Error('Invalid QR image');
  return img;
}
async function generateShareImage() {
  const winner = pool[0], button = document.querySelector('.share-button');
  if (!winner || button.disabled) return;
  const old = button.textContent;
  const top3 = [winner, finalistLoser, eliminatedThird].filter(Boolean);
  button.disabled = true;
  button.textContent = '正在生成…';
  try {
    const [assets, qr] = await Promise.all([loadShareAssets(), loadResultQr()]);
    const [bg, faces, mascot] = await Promise.all([
      loadImg(assets.background), loadImg(assets.faces), loadImg(assets.mascot)
    ]);
    const cv = document.createElement('canvas'), c = cv.getContext('2d');
    // Preserve the original 1080:1700 export aspect ratio and resolution.
    cv.width = 1080; cv.height = 1700;
    c.fillStyle = '#fff0dc'; c.fillRect(0, 0, 1080, 1700);
    c.save(); c.globalAlpha = .17; cover(c, bg, 0, 0, 1080, 1700); c.restore();
    c.fillStyle = 'rgba(255,241,220,.34)'; c.fillRect(0, 0, 1080, 1700);

    // Keep the confirmed heading baseline and wolf/cat position unchanged.
    c.fillStyle = '#ff9418'; c.font = '900 62px sans-serif'; c.textAlign = 'center';
    const heading = '我的政瞳糖点冠军', hw = c.measureText(heading).width;
    const hx = (1080 - (hw + 20 + 69 + 7 + 72)) / 2;
    c.fillText(heading, hx + hw / 2, 310);
    c.drawImage(faces, 820, 140, 650, 720, hx + hw + 20, 250, 69, 68);
    c.drawImage(faces, 40, 170, 700, 680, hx + hw + 96, 250, 72, 68);

    const title = shareText(c, winner.title, 740, 64, 38, 2, 900);
    // Reserve the lower-right character's area instead of drawing text under it.
    const desc = shareText(c, winner.desc || '', 500, 31, 25, 3, 500);
    const cy = 350, titleY = cy + (winner.date ? 126 : 91);
    const descY = titleY + (title.lines.length - 1) * title.lineHeight + 53;
    const contentBottom = desc.lines.length ? descY + (desc.lines.length - 1) * desc.lineHeight : titleY + (title.lines.length - 1) * title.lineHeight;
    const ch = Math.max(winner.desc ? 270 : 220, contentBottom - cy + 53);
    c.save(); c.shadowColor = 'rgba(75,52,36,.2)'; c.shadowOffsetY = 10; c.shadowBlur = 12;
    c.fillStyle = '#fffaf2'; rr(c, 90, cy, 900, ch, 48); c.fill(); c.restore();
    c.strokeStyle = '#ff9418'; c.lineWidth = 7; rr(c, 90, cy, 900, ch, 48); c.stroke();
    if (winner.date) {c.textAlign = 'left'; c.fillStyle = '#d96908'; c.font = '800 28px sans-serif'; c.fillText(winner.date, 145, cy + 57);}
    c.textAlign = 'center';
    paintShareText(c, title, 540, titleY, '#4b3424');
    paintShareText(c, desc, 540, descY, '#72513a');
    // Keep the prominent character overlapping the card, never shrink it.
    c.drawImage(mascot, 795, cy + ch - 107, 205, 175);

    let y = cy + ch + 84;
    c.fillStyle = '#4b3424'; c.font = '900 36px sans-serif'; c.fillText('我的 TOP 3', 540, y);
    y += 25;
    for (const [i, item] of top3.entries()) {
      const name = shareText(c, item.title, 595, 32, 27, 2, 800);
      const rowHeight = Math.max(76, name.lines.length * name.lineHeight + 22);
      c.fillStyle = i === 0 ? '#fff3e5' : '#fffaf2';
      rr(c, 115, y, 850, rowHeight, 18); c.fill();
      c.strokeStyle = i === 0 ? '#ff9418' : 'rgba(117,81,57,.25)'; c.lineWidth = i === 0 ? 3 : 2; c.stroke();
      c.textAlign = 'left'; c.fillStyle = i === 0 ? '#d96908' : '#806754'; c.font = '900 30px sans-serif';
      c.fillText(String(i + 1).padStart(2, '0'), 145, y + rowHeight / 2 + 11);
      paintShareText(c, name, 216, y + (rowHeight - name.lines.length * name.lineHeight) / 2 + name.size, i === 0 ? '#d96908' : '#4b3424');
      c.textAlign = 'right'; c.fillStyle = '#72513a'; c.font = '500 24px sans-serif';
      c.fillText(item.date || '', 932, y + rowHeight / 2 + 9);
      y += rowHeight + 14;
    }

    // Flow CTA and QR directly after TOP 3 instead of fixed, widely spaced slots.
    c.textAlign = 'center'; c.fillStyle = '#d96908'; c.font = '900 43px sans-serif';
    const ctaY = y + 42;
    c.fillText('决战政瞳糖点之巅！', 540, ctaY);
    const qrY = ctaY + 18;
    const qrSize = Math.round(Math.min(510, 1610 - (ctaY + 26)) * .85);
    if (qrSize < 300) throw new Error('Result text is too long for a clear QR');
    const qrX = Math.round((1080 - qrSize) / 2);
    c.save(); c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    // Draw the FULL 1254px source directly to export pixels. No crop, no filter.
    c.drawImage(qr, qrX, qrY, qrSize, qrSize); c.restore();
    c.fillStyle = '#72513a'; c.font = '700 30px sans-serif';
    c.fillText('扫码测你的政瞳冠军糖点', 540, qrY + qrSize + 30);

    const blob = await new Promise(resolve => cv.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('Image encoding failed');
    const file = new File([blob], '我的政瞳糖点冠军.png', {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      try {await navigator.share({files:[file], title:'我的政瞳糖点冠军'}); return;} catch (error) {
        if (error.name === 'AbortError') return;
      }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (error) {
    showBubble('分享图生成失败，请再试一次', 4);
  } finally {
    button.disabled = false; button.textContent = old;
  }
}
