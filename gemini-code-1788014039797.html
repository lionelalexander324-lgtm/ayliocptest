<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sweet Moment PK 🍊</title>
  <style>
    :root {
      --sunshine-orange: #FF9418;
      --orange-dark: #E07800;
      --orange-light: #FFB866;
      --creamy-peach: #FFF1DC;
      --creamy-card: rgba(255, 249, 239, 0.94);
      --text-main: #4A3525;
      --text-muted: #8C7361;
      --border-draw: #4A3525;
      --shadow-warm: 0 8px 24px rgba(255, 148, 24, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      background-color: var(--creamy-peach);
      /* Subtle repeating hand-drawn orange pattern */
      background-image: radial-gradient(var(--sunshine-orange) 1px, transparent 1px), radial-gradient(var(--sunshine-orange) 1px, var(--creamy-peach) 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      background-opacity: 0.15;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Mobile Canvas Container (390 x 844 reference) */
    .mobile-container {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 860px;
      background: var(--creamy-peach);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(74, 53, 37, 0.15);
      border-radius: 28px;
      overflow: hidden;
      border: 4px solid var(--border-draw);
    }

    /* Floating Hand-drawn Doodle Background Details */
    .bg-doodles {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.12;
    }
    .bg-doodle {
      position: absolute;
      fill: var(--sunshine-orange);
    }

    /* View Screens */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 20px;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      transform: scale(0.96);
      overflow-y: auto;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* Header & Progress Bar */
    .header {
      text-align: center;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .progress-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--creamy-card);
      border: 2px solid var(--border-draw);
      border-radius: 20px;
      padding: 6px 12px;
      margin-top: 10px;
      box-shadow: 0 4px 0 var(--border-draw);
    }

    .stage-item {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      padding: 3px 6px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .stage-item.active {
      background: var(--sunshine-orange);
      color: #FFF;
      transform: scale(1.15);
      box-shadow: 0 2px 0 var(--border-draw);
    }

    .stage-item.passed {
      color: var(--sunshine-orange);
      text-decoration: line-through;
    }

    /* Start Screen */
    #start-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .title-card {
      background: var(--creamy-card);
      border: 3px solid var(--border-draw);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow-warm), 0 6px 0 var(--border-draw);
      width: 100%;
      position: relative;
    }

    .title-card h1 {
      font-size: 28px;
      color: var(--sunshine-orange);
      text-shadow: 1px 1px 0 var(--border-draw);
      margin-bottom: 8px;
    }

    .mascot-hero-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 10px auto;
    }

    .btn-main {
      background: var(--sunshine-orange);
      color: #FFF;
      font-size: 20px;
      font-weight: 800;
      border: 3px solid var(--border-draw);
      padding: 14px 40px;
      border-radius: 30px;
      box-shadow: 0 6px 0 var(--border-draw);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-main:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--border-draw);
    }

    /* Cards Layout (Normal PK) */
    .pk-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .sweet-card {
      background: var(--creamy-card);
      border: 2.5px solid var(--sunshine-orange);
      border-radius: 24px;
      padding: 16px 20px;
      width: 100%;
      position: relative;
      box-shadow: var(--shadow-warm), 0 4px 0 var(--border-draw);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .sweet-card:hover {
      transform: translateY(-2px);
    }

    .sweet-card.picked {
      transform: scale(1.05) !important;
      border-color: var(--sunshine-orange);
      border-width: 3.5px;
      box-shadow: 0 0 20px rgba(255, 148, 24, 0.5), 0 6px 0 var(--border-draw);
      background: #FFF;
      z-index: 10;
    }

    .sweet-card.losing {
      opacity: 0.2;
      transform: scale(0.92);
      filter: grayscale(0.6);
    }

    .card-date {
      font-size: 12px;
      font-weight: 700;
      color: var(--sunshine-orange);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .card-sticker {
      position: absolute;
      bottom: 8px;
      right: 12px;
      width: 28px;
      height: 28px;
      opacity: 0.6;
      pointer-events: none;
    }

    .picked-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      background: var(--sunshine-orange);
      color: #FFF;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 10px;
      border: 1.5px solid var(--border-draw);
      transform: rotate(6deg) scale(0);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .sweet-card.picked .picked-badge {
      transform: rotate(6deg) scale(1);
    }

    /* VS Badge */
    .vs-badge {
      width: 42px;
      height: 42px;
      background: var(--sunshine-orange);
      border: 2.5px solid var(--border-draw);
      border-radius: 50%;
      color: #FFF;
      font-weight: 900;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 var(--border-draw);
      z-index: 5;
      margin: -6px 0;
      transform: rotate(-5deg);
    }

    /* Transition Screen (ROUND CLEAR) */
    #transition-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .clear-title {
      font-size: 32px;
      font-weight: 900;
      color: var(--sunshine-orange);
      text-shadow: 2px 2px 0 var(--border-draw);
      animation: bounce 0.6s infinite alternate ease-in-out;
    }

    /* Special 3 -> 2 Round */
    .final-three-instruction {
      font-size: 14px;
      font-weight: 700;
      color: var(--orange-dark);
      background: rgba(255, 148, 24, 0.15);
      border: 1.5px dashed var(--sunshine-orange);
      padding: 8px 12px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 8px;
    }

    .sweet-card.eliminated {
      opacity: 0.35;
      border-color: #A08C7D !important;
      background: #EFE8DE !important;
      transform: scale(0.94);
    }

    .sweet-card.finalist-glowing {
      border-color: var(--sunshine-orange) !important;
      box-shadow: 0 0 15px var(--sunshine-orange), 0 4px 0 var(--border-draw) !important;
      animation: pulseGlow 1.5s infinite alternate;
    }

    /* Winner Champion Screen */
    #champion-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .crown-icon {
      font-size: 48px;
      animation: floatCrown 2s infinite ease-in-out;
    }

    .champion-card-wrap {
      width: 100%;
      position: relative;
    }

    .fandom-trio {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    /* Animations */
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 8px var(--sunshine-orange), 0 4px 0 var(--border-draw); }
      to { box-shadow: 0 0 20px var(--sunshine-orange), 0 4px 0 var(--border-draw); }
    }

    @keyframes floatCrown {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(-4deg); }
    }

    @keyframes confettiFall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(400px) rotate(360deg); opacity: 0; }
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--sunshine-orange);
      border-radius: 2px;
      pointer-events: none;
      animation: confettiFall 2.5s infinite linear;
    }

    .referee-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--creamy-card);
      border: 2px solid var(--border-draw);
      border-radius: 16px;
      padding: 6px 10px;
      margin-bottom: 8px;
    }
  </style>
</head>

    // Tournament State
    let currentPool = [];
    let nextPool = [];
    let matchIndex = 0;
    let currentStage = 48; // 48 -> 24 -> 12 -> 6 -> 3 -> 2 -> 1
    let selectedForElimination = null;

    const stages = [48, 24, 12, 6, 3, 2, 1];

    // Corner Doodles for cards
    const cardCornerSVGs = [
      // Pillow mascot corner
      `<svg viewBox="0 0 40 40" class="card-sticker"><rect x="5" y="10" width="30" height="20" rx="6" fill="#FF9418" stroke="#4A3525" stroke-width="2"/><circle cx="15" cy="18" r="2" fill="#4A3525"/><circle cx="25" cy="18" r="2" fill="#4A3525"/><path d="M18,22 Q20,24 22,22" stroke="#4A3525" stroke-width="1.5" fill="none"/></svg>`,
      // Tiger-snake corner
      `<svg viewBox="0 0 40 40" class="card-sticker"><path d="M10,30 C15,20 25,35 30,25" fill="none" stroke="#4A3525" stroke-width="2"/><circle cx="20" cy="15" r="8" fill="#FF9418" stroke="#4A3525" stroke-width="2"/><circle cx="17" cy="15" r="1.5" fill="#4A3525"/><circle cx="23" cy="15" r="1.5" fill="#4A3525"/></svg>`,
      // Bird corner
      `<svg viewBox="0 0 40 40" class="card-sticker"><path d="M10,22 C10,12 25,12 30,20 C35,22 38,20 38,25 C32,30 20,32 10,22 Z" fill="#FFF9EF" stroke="#4A3525" stroke-width="2"/><polygon points="10,20 4,22 10,25" fill="#FF9418"/></svg>`
    ];

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function updateProgressBar() {
      stages.forEach(st => {
        const el = document.getElementById(`p-${st}`);
        if (!el) return;
        el.classList.remove('active', 'passed');
        if (st === currentStage) {
          el.classList.add('active');
        } else if (stages.indexOf(st) < stages.indexOf(currentStage)) {
          el.classList.add('passed');
        }
      });
    }

    // Shuffle Array Utility
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startGame() {
      currentPool = shuffle(rawCardsData);
      nextPool = [];
      matchIndex = 0;
      currentStage = 48;
      showScreen('game-screen');
      updateProgressBar();
      renderMatch();
    }

    function renderMatch() {
      const container = document.getElementById('cards-container');
      const instruction = document.getElementById('special-instruction');
      const headerTitle = document.getElementById('header-stage-title');
      const refText = document.getElementById('referee-text');

      container.innerHTML = '';
      instruction.style.display = 'none';

      // --- SPECIAL 3 -> 2 ELIMINATION ROUND ---
      if (currentStage === 3) {
        headerTitle.innerText = "FINAL THREE";
        refText.innerText = "Eliminate ONE card to set the final two!";
        instruction.style.display = 'block';

        currentPool.forEach((card, index) => {
          const cardEl = createCardElement(card, index, false);
          cardEl.onclick = () => handleThreeEliminationClick(index);
          container.appendChild(cardEl);
        });
        return;
      }

      // --- FINAL ROUND (2 Cards Left) ---
      if (currentStage === 2) {
        headerTitle.innerText = "THE FINAL";
        refText.innerText = "One last choice. Choose your Champion!";
      } else {
        headerTitle.innerText = `ROUND OF ${currentStage}`;
        refText.innerText = "Pick your preferred moment!";
      }

      // --- NORMAL 2-CARD HEAD-TO-HEAD ---
      const cardA = currentPool[matchIndex];
      const cardB = currentPool[matchIndex + 1];

      const elA = createCardElement(cardA, 0, true);
      const elB = createCardElement(cardB, 1, true);

      elA.onclick = () => handleNormalPick(0, elA, elB);
      elB.onclick = () => handleNormalPick(1, elB, elA);

      const vsBadge = document.createElement('div');
      vsBadge.className = 'vs-badge';
      vsBadge.innerText = 'VS';

      container.appendChild(elA);
      container.appendChild(vsBadge);
      container.appendChild(elB);
    }

    function createCardElement(card, index, isHeadToHead) {
      const div = document.createElement('div');
      div.className = 'sweet-card';

      // Pick a corner sticker SVG based on index or title length
      const stickerSvg = cardCornerSVGs[index % cardCornerSVGs.length];

      div.innerHTML = `
        <div class="picked-badge">PICKED 💕</div>
        <div class="card-date">
          <span>🍊</span> ${card.date}
        </div>
        <div class="card-title">${card.title}</div>
        <div class="card-desc">${card.desc}</div>
        ${stickerSvg}
      `;
      return div;
    }

    // --- PICK ANIMATION & LOGIC FOR NORMAL PK ---
    function handleNormalPick(winnerIdx, winnerEl, loserEl) {
      // Disable double click
      winnerEl.style.pointerEvents = 'none';
      loserEl.style.pointerEvents = 'none';

      winnerEl.classList.add('picked');
      loserEl.classList.add('losing');

      const winnerCard = currentPool[matchIndex + winnerIdx];
      nextPool.push(winnerCard);

      setTimeout(() => {
        matchIndex += 2;
        if (matchIndex >= currentPool.length) {
          // Stage Complete!
          advanceStage();
        } else {
          renderMatch();
        }
      }, 700);
    }

    // --- ELIMINATION LOGIC FOR SPECIAL 3->2 ROUND ---
    function handleThreeEliminationClick(elimIndex) {
      const cards = document.querySelectorAll('.sweet-card');
      cards.forEach((c, idx) => {
        c.style.pointerEvents = 'none';
        if (idx === elimIndex) {
          c.classList.add('eliminated');
          const badge = c.querySelector('.picked-badge');
          if (badge) {
            badge.innerText = 'ELIMINATED ❌';
            badge.style.background = '#8C7361';
            badge.style.transform = 'rotate(-6deg) scale(1)';
          }
        } else {
          c.classList.add('finalist-glowing');
        }
      });

      // Save remaining two
      nextPool = currentPool.filter((_, idx) => idx !== elimIndex);

      setTimeout(() => {
        currentPool = [...nextPool];
        nextPool = [];
        matchIndex = 0;
        currentStage = 2;
        updateProgressBar();
        renderMatch();
      }, 1000);
    }

    function advanceStage() {
      const prevStage = currentStage;
      currentStage = nextPool.length;
      currentPool = [...nextPool];
      nextPool = [];
      matchIndex = 0;

      updateProgressBar();

      if (currentStage === 1) {
        // Champion reached!
        showChampion();
      } else {
        // Show ROUND CLEAR transition
        document.getElementById('transition-title').innerText = `ROUND OF ${prevStage} CLEAR!`;
        document.getElementById('transition-sub').innerText = `${currentStage} Sweet Moments Survive`;
        showScreen('transition-screen');
      }
    }

    function nextRoundFromTransition() {
      showScreen('game-screen');
      renderMatch();
    }

    function showChampion() {
      const championCard = currentPool[0];
      const slot = document.getElementById('champion-card-slot');
      slot.innerHTML = '';

      const cardEl = createCardElement(championCard, 0, false);
      cardEl.style.borderWidth = '3px';
      cardEl.style.boxShadow = '0 0 25px rgba(255, 148, 24, 0.6), 0 6px 0 var(--border-draw)';
      slot.appendChild(cardEl);

      // Trigger orange confetti
      spawnConfetti();

      showScreen('champion-screen');
    }

    function spawnConfetti() {
      const container = document.getElementById('champion-screen');
      for (let i = 0; i < 25; i++) {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 80 + 10 + '%';
        conf.style.top = Math.random() * 20 + '%';
        conf.style.animationDelay = Math.random() * 2 + 's';
        conf.style.background = Math.random() > 0.5 ? '#FF9418' : '#FFB866';
        container.appendChild(conf);

        setTimeout(() => conf.remove(), 4500);
      }
    }
  </script>
